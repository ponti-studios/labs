name: debug-railway-status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - run: npm install -g @railway/cli@4.58.0
      - run: railway status --service ${{ secrets.RAILWAY_SERVICE_PLAYGROUND }}
      - run: railway logs --service ${{ secrets.RAILWAY_SERVICE_PLAYGROUND }} --build || true
