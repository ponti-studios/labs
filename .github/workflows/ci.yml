name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    services:
      postgres-test:
        image: ghcr.io/ponti-studios/foundation/postgres:1.0.5
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hominem-test
        ports:
          - 4433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:4433/hominem-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Migrate test database
        run: pnpm db:migrate
      - run: pnpm lint:check
      - run: pnpm typecheck:shared
      - run: pnpm typecheck
      - run: pnpm typecheck:game
      - run: pnpm test
      - run: pnpm test:shared
      - run: pnpm test:game

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - name: Verify What performance guardrails
        run: |
          test -f packages/labs/public/games/game/manifest.webmanifest
          test -f packages/labs/public/games/game/sw.js
          test -f packages/labs/public/games/game/icons/icon-192.png
          test -f packages/labs/public/games/game/icons/icon-512.png
          if rg -n 'fonts\.googleapis\.com|fonts\.gstatic\.com|font-\[.Geist.|"Geist"|"Inter"' packages/labs/app; then
            echo "Custom font loading or references found in app source"
            exit 1
          fi

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{matrix.language}}"
