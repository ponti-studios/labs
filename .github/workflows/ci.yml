name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/labs/**"
      - "packages/what/**"
      - "packages/ai/**"
      - "packages/db/**"
      - "packages/env/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/reusable-railway-deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    services:
      postgres-test:
        image: ghcr.io/ponti-studios/foundation/postgres:1.0.5
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hominem-test
        ports:
          - 4433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:4433/hominem-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Migrate test database
        run: pnpm db:migrate
      - run: pnpm lint:check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/*/tsconfig.tsbuildinfo
            tsconfig.tsbuildinfo
            packages/ai/dist
            packages/db/dist
            packages/env/dist
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('packages/*/tsconfig.json', 'tsconfig.base.json', 'tsconfig.json', 'pnpm-lock.yaml', 'packages/ai/src/**', 'packages/db/src/**', 'packages/env/src/**') }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:shared
      - run: pnpm test:game

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all

  migrate:
    if: github.event_name != 'pull_request'
    needs: [lint-and-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  deploy-labs:
    if: github.event_name != 'pull_request'
    needs: migrate
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      node-version: "24"
      railway-cli-version: "4.58.0"
      config_path: "packages/labs/railway.json"
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.RAILWAY_SERVICE }}

  deploy-what:
    if: github.event_name != 'pull_request'
    needs: migrate
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      node-version: "24"
      railway-cli-version: "5.41.2"
      config_path: "packages/what/railway.json"
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.WHAT_RAILWAY_SERVICE }}

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{matrix.language}}"
