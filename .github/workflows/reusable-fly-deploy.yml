name: reusable-fly-deploy

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Maximum deployment job duration
        required: false
        type: number
        default: 10
    secrets:
      fly_api_token:
        description: Fly deploy token scoped to the Labs app
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: Production
    steps:
      - name: checkout-code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: setup-flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
        with:
          version: 0.5.2

      - name: validate-fly-token
        env:
          FLY_API_TOKEN: ${{ secrets.fly_api_token }}
        run: test -n "$FLY_API_TOKEN"

      - name: deploy-to-fly
        env:
          FLY_API_TOKEN: ${{ secrets.fly_api_token }}
        run: flyctl deploy --remote-only --ha=false --wait-timeout 10m
