name: realitea - generate
run-name: realitea-${{ inputs.mode || 'schedule' }}-${{ inputs.requestId || github.run_id }}

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gap_fill leaves existing rows; force deletes then regenerates the window"
        required: false
        default: force
        type: choice
        options:
          - force
          - gap_fill
      daysAhead:
        description: "Days ahead from tomorrow when from/to are omitted"
        required: false
        default: "7"
        type: string
      from:
        description: "Inclusive YYYY-MM-DD start (optional; requires to)"
        required: false
        type: string
      to:
        description: "Inclusive YYYY-MM-DD end (optional; requires from)"
        required: false
        type: string
      requestId:
        description: "Console bind id; ignored by the generate script"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: realitea-generate
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: realitea-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: run-db-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: ingest-feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm realitea:ingest

      - name: generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INPUT_EVENT_NAME: ${{ github.event_name }}
          INPUT_DAYS_AHEAD: ${{ inputs.daysAhead }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$INPUT_EVENT_NAME" = "schedule" ]; then
            pnpm realitea:generate
            exit 0
          fi
          if [[ ! "$INPUT_DAYS_AHEAD" =~ ^[0-9]+$ ]]; then
            echo "daysAhead must be a non-negative integer"
            exit 1
          fi
          if [[ -n "$INPUT_FROM" || -n "$INPUT_TO" ]]; then
            if [[ ! "$INPUT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ! "$INPUT_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "from and to must both be YYYY-MM-DD dates"
              exit 1
            fi
          fi
          case "$INPUT_MODE" in
            gap_fill|force) ;;
            *) echo "mode must be gap_fill or force"; exit 1 ;;
          esac
          ARGS=("--days-ahead=$INPUT_DAYS_AHEAD")
          if [[ -n "$INPUT_FROM" && -n "$INPUT_TO" ]]; then
            ARGS+=("--from=$INPUT_FROM" "--to=$INPUT_TO")
          elif [[ -n "$INPUT_FROM" || -n "$INPUT_TO" ]]; then
            echo "from and to must be supplied together"
            exit 1
          fi
          if [ "$INPUT_MODE" != "gap_fill" ]; then
            ARGS+=(--force)
          fi
          pnpm realitea:generate "${ARGS[@]}"

      - name: health-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm realitea:health-check
