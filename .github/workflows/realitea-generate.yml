name: realitea - generate

on:
  schedule:
    # Daily at 5:00 PM UTC = 9:00 AM Pacific (DST-safe)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      daysAhead:
        description: "Force-regenerate: number of days ahead to regenerate (manual runs only)"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: realitea-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: "pnpm"

      - name: install-dependencies
        run: pnpm install --frozen-lockfile --filter @pontistudios/labyrinth...

      - name: run-db-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @pontistudios/labyrinth db:migrate

      - name: ingest-feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm --filter @pontistudios/labyrinth exec tsx scripts/realitea-ingest.ts

      - name: generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm --filter @pontistudios/labyrinth realitea:generate --force --days-ahead=${{ github.event.inputs.daysAhead }}
          else
            pnpm --filter @pontistudios/labyrinth realitea:generate
          fi

      - name: health-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm --filter @pontistudios/labyrinth exec tsx scripts/realitea-health-check.ts
