name: realitea - generate

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      daysAhead:
        description: "Force-regenerate: number of days ahead to regenerate (manual runs only)"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: realitea-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: "pnpm"

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: run-db-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: ingest-feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: tsx scripts/realitea-ingest.ts

      - name: generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm realitea:generate --force --days-ahead=${{ github.event.inputs.daysAhead }}
          else
            pnpm realitea:generate
          fi

      - name: health-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: tsx scripts/realitea-health-check.ts
