name: realitea - generate
run-name: realitea-${{ inputs.mode || 'schedule' }}-${{ inputs.requestId || github.run_id }}

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gap_fill leaves existing rows; force deletes then regenerates the window"
        required: false
        default: force
        type: choice
        options:
          - force
          - gap_fill
      daysAhead:
        description: "Days ahead from tomorrow when from/to are omitted"
        required: false
        default: "7"
        type: string
      from:
        description: "Inclusive YYYY-MM-DD start (optional; requires to)"
        required: false
        type: string
      to:
        description: "Inclusive YYYY-MM-DD end (optional; requires from)"
        required: false
        type: string
      requestId:
        description: "Console bind id; ignored by the generate script"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: realitea-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: "pnpm"

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: run-db-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: ingest-feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm realitea:ingest

      - name: generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm realitea:generate
            exit 0
          fi
          ARGS=(--days-ahead="${{ github.event.inputs.daysAhead }}")
          if [ -n "${{ github.event.inputs.from }}" ] && [ -n "${{ github.event.inputs.to }}" ]; then
            ARGS+=(--from="${{ github.event.inputs.from }}" --to="${{ github.event.inputs.to }}")
          fi
          if [ "${{ github.event.inputs.mode }}" != "gap_fill" ]; then
            ARGS+=(--force)
          fi
          pnpm realitea:generate "${ARGS[@]}"

      - name: health-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm realitea:health-check
