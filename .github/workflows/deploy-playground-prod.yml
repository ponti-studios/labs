name: deploy-labyrinth-prod

on:
  workflow_run:
    workflows: [deploy-db-prod]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-labyrinth-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect Labs changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | rg -q '^(packages/labs/|packages/(ai|db|env)/|pnpm-lock.yaml|\.oxl|\.oxf|vitest|\.github/workflows/(deploy-playground-prod|reusable-railway-deploy)\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: needs.changes.outputs.changed == 'true'
    needs: changes
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      node-version: "24"
      railway-cli-version: "4.58.0"
      config_path: "packages/labs/railway.json"
      deploy_path: ""
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.RAILWAY_SERVICE }}
