name: deploy-labyrinth-prod

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/deploy-playground-prod.yml"
      - ".github/workflows/reusable-railway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-labyrinth-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  deploy:
    needs: migrate
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      config_path: railway.json
      node-version: "24"
      railway-cli-version: "4.58.0"
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.RAILWAY_SERVICE_PLAYGROUND }}
