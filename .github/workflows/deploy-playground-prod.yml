name: deploy-labyrinth-prod

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - "railway.json"
      - "public/**"
      - "*.config.*"
      - "drizzle.config.ts"
      - "react-router.config.ts"
      - "tsconfig.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "vitest*.ts"
      - ".github/workflows/deploy-playground-prod.yml"
      - ".github/workflows/reusable-railway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-labyrinth-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: migrate
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      node-version: "24"
      railway-cli-version: "4.58.0"
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.RAILWAY_SERVICE }}
