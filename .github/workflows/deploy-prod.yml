name: deploy-prod

on:
  push:
    branches: [main]
    paths:
      - "packages/labs/**"
      - "packages/what/**"
      - "packages/ai/**"
      - "packages/db/**"
      - "packages/env/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/reusable-railway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

  deploy-labs:
    needs: migrate
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      node-version: "24"
      railway-cli-version: "4.58.0"
      config_path: "packages/labs/railway.json"
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.RAILWAY_SERVICE }}

  deploy-what:
    needs: migrate
    uses: ./.github/workflows/reusable-railway-deploy.yml
    with:
      node-version: "24"
      railway-cli-version: "5.41.2"
      config_path: "packages/what/railway.json"
      timeout-minutes: 10
    secrets:
      railway_token: ${{ secrets.RAILWAY_TOKEN }}
      railway_service: ${{ secrets.WHAT_RAILWAY_SERVICE }}
