name: reusable-railway-deploy

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to install Railway CLI
        required: false
        type: string
        default: "24"
      config_path:
        description: Optional path to a service-specific Railway config file
        required: false
        type: string
        default: ""
      railway-cli-version:
        description: Railway CLI version to install
        required: false
        type: string
        default: "4.58.0"
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 10
      deploy_path:
        description: Optional subdirectory to deploy as the source root
        required: false
        type: string
        default: ""
    secrets:
      railway_token:
        description: Railway API token
        required: true
      railway_service:
        description: Railway service identifier
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: Production
    env:
      RAILWAY_TOKEN: ${{ secrets.railway_token }}
      RAILWAY_SERVICE: ${{ secrets.railway_service }}

    steps:
      - name: checkout-code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: install-railway-cli
        run: npm install -g @railway/cli@${{ inputs.railway-cli-version }}

      - name: validate-env
        run: test -n "$RAILWAY_TOKEN"

      - name: stage-railway-config
        if: inputs.config_path != ''
        run: cp "${{ inputs.config_path }}" railway.json

      - name: deploy-to-railway
        env:
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        run: |
          if [ -n "$DEPLOY_PATH" ]; then
            railway up "$DEPLOY_PATH" --path-as-root --service "$RAILWAY_SERVICE" --detach --ci
          else
            railway up --service "$RAILWAY_SERVICE" --detach --ci
          fi
